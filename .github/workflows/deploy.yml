name: Deploy

on:
  push:
    branches: [master]

# One deploy at a time. Overlapping runs race on `docker compose up`, and the loser
# fails recreating a container the winner is already replacing. Queue rather than
# cancel: a cancelled run can leave the server mid-recreate.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='venv' \
            --exclude='dist' \
            --exclude='infra/.terraform' \
            --exclude='infra/terraform.tfstate*' \
            --exclude='infra/deploy_key' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/srv/apps/bible-books-tracker/

      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /srv/apps/bible-books-tracker
            docker compose -f docker-compose.prod.yml up -d --build
            nginx -t && systemctl reload nginx
          EOF
