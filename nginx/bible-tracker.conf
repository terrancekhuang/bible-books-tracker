  # Guest accounts are minted unauthenticated, so cap them per IP. The burst lets a room of
  # newcomers on one Wi-Fi start together; a script gets one every 6 s after that.
  limit_req_zone $binary_remote_addr zone=bible_guest:1m rate=10r/m;

  server {
      server_name bible.terrancehuang.dev;

      location = /auth/guest {
          limit_req zone=bible_guest burst=20 nodelay;
          limit_req_status 429;
          proxy_pass http://127.0.0.1:5001;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /api/ {
          proxy_pass http://127.0.0.1:5001;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /auth/ {
          proxy_pass http://127.0.0.1:5001;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
  
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bible.terrancehuang.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bible.terrancehuang.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
  server {
    if ($host = bible.terrancehuang.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


      listen 80;
      server_name bible.terrancehuang.dev;
    return 404; # managed by Certbot


}